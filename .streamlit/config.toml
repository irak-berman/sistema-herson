# Tema visual del sistema de inventario del Depósito Dental HERSON.
#
# El color principal es el mismo azul del logotipo del negocio, para que
# el sistema y la nota de venta se perciban como una sola cosa. El rojo
# queda reservado para las acciones que destruyen o cancelan
# información, de modo que el usuario distinga de un vistazo lo que es
# seguro de lo que no.

[theme]
primaryColor = "#2B2C6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5FA"
textColor = "#1A1D29"

# Se usa la familia del sistema y no una fuente descargada, porque el
# sistema debe operar sin conexión a internet.
font = "sans serif"

[server]
# El sistema opera en una sola computadora, sin exponerse a la red.
address = "localhost"

# Aquí NO se pone headless. Si se pone, Streamlit deja de abrir el
# navegador y al correrlo desde la terminal parece que no pasó nada.
# El archivo iniciar.bat pasa esa opción por su cuenta, porque es el
# único caso donde sí estorba que Streamlit abra una ventana extra.

[browser]
# No se envían estadísticas de uso a servidores externos.
gatherUsageStats = false

[client]
# Durante el desarrollo conviene ver el error completo en pantalla.
# Al instalar en el depósito, este valor cambia a "none" para que el
# personal no se encuentre con un rastreo técnico mientras vende.
showErrorDetails = "full"
